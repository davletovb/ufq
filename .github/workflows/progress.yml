name: Progress tracker

# Keeps docs/progress/ honest: the generated views must match the data, and every
# requirement ID a pull request cites must actually exist.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Data and generated views
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the registry and check the views are current
        run: python3 tools/progress/progress.py check

      - name: Resolve cited requirement IDs
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          python3 tools/progress/progress.py cite-check \
            --base "$BASE_SHA" \
            --text-file "$RUNNER_TEMP/pr-title.txt" \
            --text-file "$RUNNER_TEMP/pr-body.txt"

  comment:
    name: Pull-request summary
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the comment body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          python3 tools/progress/progress.py pr-report \
            --base "$BASE_SHA" \
            --repo-url "$REPO_URL" \
            --text-file "$RUNNER_TEMP/pr-title.txt" \
            --text-file "$RUNNER_TEMP/pr-body.txt" \
            --out "$RUNNER_TEMP/progress-comment.md"

      - name: Post or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/progress-comment.md', 'utf8');
            const marker = '<!-- ufq-progress-tracker -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(
              (c) => c.user.type === 'Bot' && (c.body || '').includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
